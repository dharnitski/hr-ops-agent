name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync
      - run: uv run pytest tests/unit

  eval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync
      # Live model + MCP calls need GCP auth. Configure by setting the GOOGLE_CLOUD_PROJECT
      # repo variable and GCP_WIF_PROVIDER / GCP_WIF_SERVICE_ACCOUNT repo secrets (Workload
      # Identity Federation, no long-lived key) -- until then this job skips (docs/PROGRESS.md M5.5).
      - name: Authenticate to GCP
        if: vars.GOOGLE_CLOUD_PROJECT != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
      - name: Run eval gate
        if: vars.GOOGLE_CLOUD_PROJECT != ''
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION || 'global' }}
          GOOGLE_GENAI_USE_ENTERPRISE: "true"
          MODEL_ID: ${{ vars.MODEL_ID || 'gemini-3.5-flash-lite' }}
        run: uv run python scripts/run_eval_gate.py
      - name: Eval gate not configured
        if: vars.GOOGLE_CLOUD_PROJECT == ''
        run: |
          echo "GOOGLE_CLOUD_PROJECT repo variable not set; skipping the live eval gate."
          echo "See docs/PROGRESS.md M5.5 for the GCP auth this needs before it can run."
