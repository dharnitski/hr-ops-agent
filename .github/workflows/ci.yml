name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync
      - run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync
      - run: uv run pytest tests/unit

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync
      # No eval sets or agent until Module 1 step 4 / Module 5; enforce once evalsets exist.
      - name: Run eval gate
        run: |
          if ls evals/*.evalset.json >/dev/null 2>&1; then
            uv run adk eval hr_agent evals/*.evalset.json
          else
            echo "No eval sets yet; skipping."
          fi
