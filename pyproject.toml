[project]
name = "hr-ops-agent"
version = "0.1.0"
description = "HR operations agent built on Google ADK, with HCM tools exposed via an MCP server."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-adk",
    "mcp",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hr_agent*", "mcp_server*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = ["integration: crosses a real boundary (MCP server, model, GCP)"]
asyncio_mode = "auto"
