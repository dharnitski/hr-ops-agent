[project]
name = "hr-ops-agent"
version = "0.1.0"
description = "HR operations agent built on Google ADK, with HCM tools exposed via an MCP server."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-adk[eval]",
    "mcp",
]

[dependency-groups]
dev = [
    "google-adk[gcp,otel-gcp]>=2.11.0",
    "langchain>=1.4.2",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.12",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "ty>=0.0.84",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hr_agent*", "mcp_server*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "C4", "PT", "RUF", "ANN", "S", "ASYNC", "PL",
    "TID", "ARG", "PTH", "T20", "RET", "PERF", "TRY",
]
ignore = ["TRY003", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
# Scratch scripts print by design.
"scratch/**" = ["T201"]
# CI script's whole job is to write its own log output.
"scripts/**" = ["T201"]
# adk eval's loader re-execs hr_agent/__init__.py under a synthetic top-level module name
# (see docs/PROGRESS.md M5.1); an absolute `from hr_agent...` import inside the package would
# resolve against the real installed "hr_agent" name instead, double-loading the module tree
# and crashing on shared singleton agents. Parent-relative imports keep the whole package
# self-contained under whatever name it's loaded as.
"hr_agent/agents/**" = ["TID252"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = ["integration: crosses a real boundary (MCP server, model, GCP)"]
# Third-party deprecations we can't fix; keep narrow so our own warnings still show.
filterwarnings = [
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
    "ignore:BaseAgentConfig is deprecated:DeprecationWarning",
    "ignore:Inheritance class AiohttpClientSession:DeprecationWarning",
    "ignore:\\[EXPERIMENTAL\\] feature FeatureName.JSON_SCHEMA_FOR_FUNC_DECL:UserWarning",
    "ignore:MCPTool class is deprecated:DeprecationWarning",
    "ignore:\\[EXPERIMENTAL\\] feature FeatureName.BASE_AUTHENTICATED_TOOL:UserWarning",
    "ignore:\\[EXPERIMENTAL\\] feature FeatureName._MCP_GRACEFUL_ERROR_HANDLING:UserWarning",
    "ignore:\\[EXPERIMENTAL\\] feature FeatureName.PLUGGABLE_AUTH:UserWarning",
]
asyncio_mode = "auto"
