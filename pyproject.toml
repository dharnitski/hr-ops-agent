[project]
name = "hr-ops-agent"
version = "0.1.0"
description = "HR operations agent built on Google ADK, with HCM tools exposed via an MCP server."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-adk[eval]",
    "mcp",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hr_agent*", "mcp_server*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "C4", "PT", "RUF", "ANN", "S", "ASYNC", "PL",
    "TID", "ARG", "PTH", "T20", "RET", "PERF", "TRY",
]
ignore = ["TRY003", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
# Scratch scripts print by design.
"scratch/**" = ["T201"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = ["integration: crosses a real boundary (MCP server, model, GCP)"]
# Third-party deprecations we can't fix; keep narrow so our own warnings still show.
filterwarnings = [
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
    "ignore:BaseAgentConfig is deprecated:DeprecationWarning",
    "ignore:Inheritance class AiohttpClientSession:DeprecationWarning",
    "ignore:\\[EXPERIMENTAL\\] feature FeatureName.JSON_SCHEMA_FOR_FUNC_DECL:UserWarning",
]
asyncio_mode = "auto"
